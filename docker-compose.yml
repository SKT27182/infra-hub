# Port, credential, and persist-dir substitution come from backend/.env
# (single source of truth). Bind-mount data lives under INFRA_PERSIST_DIR
# (default: ~/.local/share/infra-hub/volumes) — not in the repo tree.
# Use: docker compose --env-file backend/.env up -d
# Or:  make up / make dev / make dev-local (Makefile passes --env-file automatically)


services:
  # =============================================================================
  # PostgreSQL - Primary Relational Database
  # =============================================================================
  postgres:
    image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: infra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-54321}:${POSTGRES_INTERNAL_PORT:-5432}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${INFRA_PERSIST_DIR}/postgres:/var/lib/postgresql/data
    networks:
      - infra-network

  # =============================================================================
  # Redis - In-Memory Cache & Pub/Sub
  # =============================================================================
  redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: infra-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-63791}:${REDIS_INTERNAL_PORT:-6379}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${INFRA_PERSIST_DIR}/redis:/data
    networks:
      - infra-network

  # =============================================================================
  # MongoDB - Document Database
  # =============================================================================
  mongodb:
    image: mongo@sha256:951c2ff9fc6bdb6cb89b1dfea4a0e8ae3ee4fb287c0bf579b2bba54c7803f75d
    container_name: infra-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${MONGODB_PORT:-27018}:${MONGODB_INTERNAL_PORT:-27017}"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${INFRA_PERSIST_DIR}/mongodb:/data/db
    networks:
      - infra-network

  # =============================================================================
  # Qdrant - Vector Database (dashboard requires QDRANT_API_KEY when set)
  # =============================================================================
  qdrant:
    image: qdrant/qdrant@sha256:0bd98fa7977f1e75694779359ca4e212822e5a71334e28421182f72f209d5286
    container_name: infra-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${QDRANT_REST_PORT:-6333}:${QDRANT_REST_INTERNAL_PORT:-6333}"
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:${QDRANT_GRPC_INTERNAL_PORT:-6334}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/127.0.0.1/${QDRANT_REST_INTERNAL_PORT:-6333}' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${INFRA_PERSIST_DIR}/qdrant:/qdrant/storage
    networks:
      - infra-network

  # =============================================================================
  # MinIO - S3-Compatible Object Storage
  # =============================================================================
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: infra-minio
    restart: unless-stopped
    command: server /data --console-address ":${MINIO_INTERNAL_CONSOLE_PORT:-9001}"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_SERVER_URL: http://${SERVICE_PUBLIC_HOST:-127.0.0.1}:${MINIO_PORT:-9000}
      MINIO_BROWSER_REDIRECT_URL: http://${SERVICE_PUBLIC_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${MINIO_PORT:-9000}:${MINIO_INTERNAL_API_PORT:-9000}"
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:${MINIO_INTERNAL_CONSOLE_PORT:-9001}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_INTERNAL_API_PORT:-9000}/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${INFRA_PERSIST_DIR}/minio:/data
    networks:
      - infra-network

  # =============================================================================
  # Neo4j - Graph Database
  # =============================================================================
  neo4j:
    image: neo4j@sha256:362542416de6c09a971484d1893878016cc3b5cdec166e54b1c824a220ecd6b9
    container_name: infra-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${NEO4J_HTTP_PORT:-7474}:${NEO4J_HTTP_INTERNAL_PORT:-7474}"
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${NEO4J_BOLT_PORT:-7687}:${NEO4J_BOLT_INTERNAL_PORT:-7687}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:${NEO4J_HTTP_INTERNAL_PORT:-7474} || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${INFRA_PERSIST_DIR}/neo4j:/data
    networks:
      - infra-network

  # =============================================================================
  # OpenSearch - Full-text search, autocomplete, k-NN vectors (local: security off)
  # =============================================================================
  opensearch:
    image: opensearchproject/opensearch@sha256:8690b204fe914c60ca76d451ac73bc0481e034d32d3779944c8caca56a2b003f
    container_name: infra-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${OPENSEARCH_HTTP_PORT:-9200}:${OPENSEARCH_HTTP_INTERNAL_PORT:-9200}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:${OPENSEARCH_HTTP_INTERNAL_PORT:-9200}/_cluster/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - ${INFRA_PERSIST_DIR}/opensearch:/usr/share/opensearch/data
    networks:
      - infra-network

  # =============================================================================
  # Admin Tools
  # =============================================================================
  pgadmin:
    image: dpage/pgadmin4@sha256:40fa840c5bb7c8463957f1255b01283732c2d8c9396a956d180f8e6c296753b3
    container_name: infra-pgadmin
    profiles: ["admin"]
    restart: unless-stopped
    user: "0:0"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${PGADMIN_PORT:-5050}:${PGADMIN_INTERNAL_PORT:-80}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mkdir -p /var/lib/pgadmin/sessions && chown -R 5050:5050 /var/lib/pgadmin && exec /entrypoint.sh"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${PGADMIN_INTERNAL_PORT:-80}/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - postgres
    volumes:
      - ${INFRA_PERSIST_DIR}/pgadmin:/var/lib/pgadmin
    networks:
      - infra-network

  redisinsight:
    image: redis/redisinsight@sha256:aa21bbd198455b4ad964f76782db951155aa0d712321f599972d1525f031f0e6
    container_name: infra-redisinsight
    profiles: ["admin"]
    restart: unless-stopped
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "${REDIS_INTERNAL_PORT:-6379}"
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD}
      RI_REDIS_ALIAS: infra-redis
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${REDISINSIGHT_PORT:-5540}:${REDISINSIGHT_INTERNAL_PORT:-5540}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mkdir -p /data/logs && chown -R 1000:1000 /data && exec ./docker-entry.sh node redisinsight/api/dist/src/main"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:${REDISINSIGHT_INTERNAL_PORT:-5540}/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ${INFRA_PERSIST_DIR}/redisinsight:/data
    networks:
      - infra-network

  mongo-express:
    image: mongo-express@sha256:1b23d7976f0210dbec74045c209e52fbb26d29b2e873d6c6fa3d3f0ae32c2a64
    container_name: infra-mongo-express
    profiles: ["admin"]
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${MONGO_EXPRESS_PORT:-8081}:${MONGO_EXPRESS_INTERNAL_PORT:-8081}"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://127.0.0.1:${MONGO_EXPRESS_INTERNAL_PORT:-8081} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - mongodb
    networks:
      - infra-network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards@sha256:7aaefffac1660cab61ecf1e52fdcde6c156587a020dfa9246d529ea5e784dcee
    container_name: infra-opensearch-dashboards
    profiles: ["admin"]
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${OPENSEARCH_DASHBOARDS_PORT:-5601}:${OPENSEARCH_DASHBOARDS_INTERNAL_PORT:-5601}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:${OPENSEARCH_DASHBOARDS_INTERNAL_PORT:-5601}/api/status || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - infra-network

# =============================================================================
# Networks
# =============================================================================
networks:
  infra-network:
    name: infra-network
    driver: bridge
