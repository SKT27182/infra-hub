# Port and credential substitution come from backend/.env (single source of truth).
# Use: docker compose --env-file backend/.env up -d
# Or:  make up / make dev / make dev-local (Makefile passes --env-file automatically)

services:
  # =============================================================================
  # PostgreSQL - Primary Relational Database
  # =============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: infra-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-main_db}
    ports:
      - "${POSTGRES_PORT:-54321}:${POSTGRES_INTERNAL_PORT:-5432}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-main_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    networks:
      - infra-network

  # =============================================================================
  # Redis - In-Memory Cache & Pub/Sub
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: infra-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    ports:
      - "${REDIS_PORT:-63791}:${REDIS_INTERNAL_PORT:-6379}"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./volumes/redis:/data
    networks:
      - infra-network

  # =============================================================================
  # MongoDB - Document Database
  # =============================================================================
  mongodb:
    image: mongo:latest
    container_name: infra-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    ports:
      - "${MONGODB_PORT:-27018}:${MONGODB_INTERNAL_PORT:-27017}"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./volumes/mongodb:/data/db
    networks:
      - infra-network

  # =============================================================================
  # Qdrant - Vector Database (dashboard requires QDRANT_API_KEY when set)
  # =============================================================================
  qdrant:
    image: qdrant/qdrant
    container_name: infra-qdrant
    restart: always
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-password}
    ports:
      - "${QDRANT_REST_PORT:-6333}:${QDRANT_REST_INTERNAL_PORT:-6333}"
      - "${QDRANT_GRPC_PORT:-6334}:${QDRANT_GRPC_INTERNAL_PORT:-6334}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/127.0.0.1/${QDRANT_REST_INTERNAL_PORT:-6333}' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./volumes/qdrant:/qdrant/storage
    networks:
      - infra-network

  # =============================================================================
  # MinIO - S3-Compatible Object Storage
  # =============================================================================
  minio:
    image: minio/minio:latest
    container_name: infra-minio
    restart: always
    command: server /data --console-address ":${MINIO_INTERNAL_CONSOLE_PORT:-9001}"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-password123}
      MINIO_SERVER_URL: http://${SERVICE_PUBLIC_HOST:-127.0.0.1}:${MINIO_PORT:-9000}
      MINIO_BROWSER_REDIRECT_URL: http://${SERVICE_PUBLIC_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${MINIO_PORT:-9000}:${MINIO_INTERNAL_API_PORT:-9000}"
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:${MINIO_INTERNAL_CONSOLE_PORT:-9001}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_INTERNAL_API_PORT:-9000}/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./volumes/minio:/data
    networks:
      - infra-network

  # =============================================================================
  # Neo4j - Graph Database
  # =============================================================================
  neo4j:
    image: neo4j:5-community
    container_name: infra-neo4j
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:${NEO4J_HTTP_INTERNAL_PORT:-7474}"
      - "${NEO4J_BOLT_PORT:-7687}:${NEO4J_BOLT_INTERNAL_PORT:-7687}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:${NEO4J_HTTP_INTERNAL_PORT:-7474} || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./volumes/neo4j:/data
    networks:
      - infra-network

  # =============================================================================
  # Admin Tools
  # =============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: infra-pgadmin
    restart: always
    user: "0:0"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-password}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:${PGADMIN_INTERNAL_PORT:-80}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mkdir -p /var/lib/pgadmin/sessions && chown -R 5050:5050 /var/lib/pgadmin && exec /entrypoint.sh"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${PGADMIN_INTERNAL_PORT:-80}/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - infra-network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: infra-redisinsight
    restart: always
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "${REDIS_INTERNAL_PORT:-6379}"
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      RI_REDIS_ALIAS: infra-redis
    ports:
      - "${REDISINSIGHT_PORT:-5540}:${REDISINSIGHT_INTERNAL_PORT:-5540}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mkdir -p /data/logs && chown -R 1000:1000 /data && exec ./docker-entry.sh node redisinsight/api/dist/src/main"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:${REDISINSIGHT_INTERNAL_PORT:-5540}/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - redisinsight_data:/data
    networks:
      - infra-network

  mongo-express:
    image: mongo-express:latest
    container_name: infra-mongo-express
    restart: always
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-password}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:${MONGO_EXPRESS_INTERNAL_PORT:-8081}"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://127.0.0.1:${MONGO_EXPRESS_INTERNAL_PORT:-8081} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - mongodb
    networks:
      - infra-network

# =============================================================================
# Networks
# =============================================================================
networks:
  infra-network:
    name: infra-network
    driver: bridge

volumes:
  pgadmin_data:
  redisinsight_data:
